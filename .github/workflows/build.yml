name: 라임이 통역기 APK 빌드

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK 빌드
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK 이름 정리
        run: cp app/build/outputs/apk/debug/app-debug.apk LimeTranslator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LimeTranslator-apk
          path: LimeTranslator.apk

      - name: 릴리즈에 APK 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 라임이 통역기 v1.0.${{ github.run_number }}
          body: |
            🦜 라임이 통역기 APK
            아래 LimeTranslator.apk를 눌러 받아서 설치하세요.
          files: LimeTranslator.apk
          make_latest: true
