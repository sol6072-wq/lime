name: 라임이 통역기 APK 빌드

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK 빌드
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK 이름 정리
        run: cp app/build/outputs/apk/debug/app-debug.apk LimeTranslator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LimeTranslator-apk
          path: LimeTranslator.apk
